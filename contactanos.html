<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/contactanos.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="contact-header">
            <img src="imagenes/Amigurumi.png" class="logo" alt="">

            <h1 class="contact-title">
                Formulario de Contacto
            </h1>

            <br>

            <p class="contact-subtitle"> 
                Nos gustaria saber cual es tu opinión.
                Porfavor completa el siguiente formulario.
            </p>
        </div>

        <br>

        <form class="contact-form">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" placeholder="Username" required>
            </div>

            <div class="form-group">
                <label>Correo</label>
                <input type="email" placeholder="Ingresa tu correo" required>
            </div>

            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" placeholder="Ingresa tu número" required>
            </div>

            <div class="form-group">
                <label>Asunto</label>
                <input type="text" placeholder="Ingrese su asunto" required>
            </div>

            <div class="form-group span-all">
                <label>Comentario</label>
                <textarea></textarea>
            </div>

            <label class="form-terms">
                <input type="checkbox">
                <p>
                    Al contactarnos, usted acepta nuestros
                    <a href="#">Términos y Condiciones</a>
                </p>
            </label>

            <button class="submit-btn span-all">Enviar</button>
        </form>
    </div>
</body>
</html>
