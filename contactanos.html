<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/contactanos.css">
    <title>Document</title>
</head>
<body>
    <div class="mapa">
        <iframe src="https://www.google.com/maps/embed?pb=!3m2!1ses-419!2spe!4v1789229222066!5m2!1ses-419!2spe!6m8!1m7!1sgfhFpknv09UdrZPstPL-lQ!2m2!1d-12.05779604292606!2d-77.10889340807411!3f182.90593067933682!4f-14.603973676744474!5f0.7820865974627469" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>

    <div class="container">
        <div class="contact-header">
            <img src="imagenes/Amigurumi.png" class="logo" alt="">

            <h1 class="contact-title">
                Formulario de Contacto
            </h1>

            <br>

            <p class="contact-subtitle"> 
                Nos gustaria saber cual es tu opinión.
                Porfavor completa el siguiente formulario.
            </p>
        </div>

        <br>

        <form class="contact-form" action="https://formsubmit.co/sebasbebedeoro@gmail.com" method="POST">
            
            <!-- (Opcional) Esta línea asegura que FormSubmit use el formato de tabla de tu imagen -->
            <input type="hidden" name="_template" value="table">

            <div class="form-group">
                <label>Nombre Completo</label>
                <!-- Se cambió a name="Nombre" -->
                <input type="text" name="Nombre" placeholder="Username" required>
            </div>

            <div class="form-group">
                <label>Correo</label>
                <!-- Se cambió a name="Correo" -->
                <input type="email" name="Correo" placeholder="Ingresa tu correo" required>
            </div>

            <div class="form-group">
                <label>Teléfono</label>
                <!-- Se cambió a name="Telefono" -->
                <input type="text" name="Telefono" placeholder="Ingresa tu número" required>
            </div>

            <div class="form-group">
                <label>Asunto</label>
                <!-- Si quieres que en el correo diga "Servicio_Interes" como en tu imagen, cambia "Asunto" por "Servicio_Interes" -->
                <input type="text" name="Asunto" placeholder="Ingrese su asunto" required>
            </div>

            <div class="form-group span-all">
                <label>Comentario</label>
                <!-- Se cambió a name="Mensaje" -->
                <textarea name="Mensaje" required></textarea>
            </div>

            <label class="form-terms">
                <input type="checkbox" required>
                <p>
                    Al contactarnos, usted acepta nuestros
                    <a href="#">Términos y Condiciones</a>
                </p>
            </label>

            <button type="submit" class="submit-btn span-all">Enviar</button>
        </form>
    </div>
</body>
</html>
